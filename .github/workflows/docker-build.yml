name: Build and Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read package version
        id: package
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # Tag ownership rules:
      # - Release refs (v* tags, dispatched by the release process) own the
      #   `latest` tag and the plain version tag (0.1.x).
      # - Main-branch pushes are development snapshots: they must never move
      #   `latest` (production web updaters track it) and must never write a
      #   package.json version tag (main's version does not bump per release,
      #   so it would clobber historical release images).
      - name: Compute app image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mmh
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=main,enable=${{ endsWith(github.ref, '/heads/main') }}
            type=sha,prefix=sha-

      - name: Verify Docker entrypoint
        run: npm run check:docker

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_COMMIT=${{ github.sha }}
            APP_COMMIT_MESSAGE=${{ github.event.head_commit.message }}
            APP_COMMIT_DATE=${{ github.event.head_commit.timestamp }}
            APP_VERSION=${{ steps.package.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compute updater image tags
        id: meta-updater
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mmh-updater
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=main,enable=${{ endsWith(github.ref, '/heads/main') }}
            type=sha,prefix=sha-

      - name: Build and push updater
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.updater
          push: true
          tags: ${{ steps.meta-updater.outputs.tags }}
          build-args: |
            APP_COMMIT=${{ github.sha }}
            APP_COMMIT_MESSAGE=${{ github.event.head_commit.message }}
            APP_COMMIT_DATE=${{ github.event.head_commit.timestamp }}
            APP_VERSION=${{ steps.package.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
