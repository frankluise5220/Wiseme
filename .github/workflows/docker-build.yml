name: Build and Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read package version
        id: package
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify Docker entrypoint
        run: npm run check:docker

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mmh:latest
            ghcr.io/${{ github.repository_owner }}/mmh:${{ steps.package.outputs.version }}
          build-args: |
            APP_COMMIT=${{ github.sha }}
            APP_COMMIT_MESSAGE=${{ github.event.head_commit.message }}
            APP_COMMIT_DATE=${{ github.event.head_commit.timestamp }}
            APP_VERSION=${{ steps.package.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push updater
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.updater
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mmh-updater:latest
            ghcr.io/${{ github.repository_owner }}/mmh-updater:${{ steps.package.outputs.version }}
          build-args: |
            APP_COMMIT=${{ github.sha }}
            APP_COMMIT_MESSAGE=${{ github.event.head_commit.message }}
            APP_COMMIT_DATE=${{ github.event.head_commit.timestamp }}
            APP_VERSION=${{ steps.package.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
